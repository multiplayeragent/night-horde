<html lang="en">

<title>Night Horde</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #05060c; }

  #cards { position: fixed; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 30px); transform: translateX(-50%); box-sizing: border-box; width: min(560px, calc(100vw - 20px)); text-align: center; }
  #cards[hidden], #over[hidden], .stick[hidden] { display: none; }
  #cardsTitle { margin-bottom: 6px; font: 900 15px system-ui, sans-serif; letter-spacing: .08em; color: #ffd166; text-shadow: 0 1px 4px #000; }
  #cardRow { display: flex; gap: 8px; }
  .pick { position: relative; flex: 1; min-width: 0; min-height: 100px; padding: 10px 8px 8px; border-radius: 12px; border: 2px solid #ffd16699; background: #141936ee; color: #eef2ff; font: 13px/1.25 system-ui, sans-serif; text-align: left; cursor: pointer; box-shadow: 0 4px 18px #000a; }
  .pick:hover { border-color: #ffd166; background: #1c2350ee; }
  .pick .ic { display: block; font-size: 22px; line-height: 1; margin-bottom: 4px; }
  .pick b { display: block; font-size: 14px; } .pick i { display: block; font-style: normal; font-size: 11px; font-weight: 800; color: #ffd166; }
  .pick small { display: block; margin-top: 3px; font-size: 12px; opacity: .8; }
  .pick kbd { position: absolute; top: 6px; right: 8px; font: 800 11px system-ui, sans-serif; opacity: .5; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #05060cb0; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; padding: 20px; border-radius: 16px; background: #121731; border: 1px solid #ffffff26; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 26px; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #7ee0ff; text-align: left; }
  .stats { display: flex; justify-content: space-around; margin-top: 10px; } .stats div { font: 900 24px/1.1 system-ui, sans-serif; color: #ffd166; font-variant-numeric: tabular-nums; }
  .stats small { display: block; font-size: 11px; font-weight: 700; color: #eef2ff; opacity: .7; letter-spacing: .06em; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd166; font-weight: 700; }
  .card li.note { list-style: none; margin-left: -24px; } /* a status line, not a numbered entry */
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .7; }

  @media (max-width: 640px) {

    #clock small { width: 100px; margin: 2px auto 0; } /* a long line wraps instead of running into the team list */
    #build { width: 130px; font-size: 11px; } #msg { font-size: 24px; }
    #boss { top: calc(env(safe-area-inset-top) + 150px); width: calc(100vw - 40px); }
    .pick { min-height: 112px; padding: 8px 6px 6px; } .pick small { font-size: 11px; } .pick kbd { display: none; }
  }

<script>
/* ═══ NIGHT HORDE · a Multiplayer Agent starter ═══════════════════════════════════════
 * Survive the night in a haunted graveyard. You only walk: your weapons fire on their own.
 * Grab the gems monsters drop, level up, pick upgrades. Co-op, 1–4 players; bots fill the team.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ night length, the horde, hunters, bots
 *   CONTENT ....... monster kinds, waves, weapons, passives (tables: add a row to add one)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FOES .......... how the horde is packed into state, the chase every screen runs, corrections
 *   WEAPONS ....... firing, bolts and daggers, hits (yours count; other people's are only drawn)
 *   NIGHT (HOST) .. the clock, spawns, elites, the boss, kills, the bots. Only the host writes these.
 *   ME ............ walking, gems, levels and upgrades, getting hurt, downed and revived. Your own.
 *   DRAW .......... graveyard, gems, monsters, hunters, weapon effects, the night
 *   HUD & RESULTS . xp bar, clock, team, level-up cards, results, leaderboard
 *   INPUT ......... keys, hold the mouse, and a thumb stick on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the horde):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: x, y, hp, max hp, level,
 *     down, revive progress, facing, build) about 12 times a second, `hb` (heartbeat) once a
 *     second, `n`/`c` (name, color) once. Your health, level and build are yours alone.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `run`   {id, v, phase: play|over, startAt, elites, swarms, boss, won, endedAt, endsAt, final}
 *       `f0` `f1` `f2`  the horde: every monster in 10 characters (see FOES); a monster always
 *               lives in field id % 3. One field is rewritten every 100ms, so each every 300ms.
 *       `team`  {k: kills per hunter, n: names}, twice a second when it changes
 *       `bots`  the bot hunters (position, health, level, build), 8 times a second
 *   - EVERY screen runs the same chase: each monster walks to the nearest standing hunter and
 *     shoves its neighbours aside. The snapshots only nudge each monster toward where the host
 *     has it, add new ones and remove dead ones. So hundreds of monsters move smoothly while
 *     the host sends about 10 horde messages a second.
 *   - Your weapons hit on YOUR screen. The damage goes to the host batched 8 times a second:
 *     "hits" {l: [[monster id, damage], ...]}. The host takes the health off and counts the kill
 *     for you. You see your kills at once; everyone else sees them in the next snapshot.
 *     Other hunters' weapons are drawn on your screen but do no damage there.
 *   - XP gems: every screen drops its OWN copy of a gem where a monster dies, so each hunter
 *     picks up its own XP and levels on its own (nobody steals your gems). An elite drops a
 *     chest the same way: one free upgrade each. Bots get their XP straight from the kills.
 *   - Getting hurt is YOUR fact: only your screen checks the monsters touching you (the host
 *     does it for the bots). At 0 health you are down; a teammate standing next to you gets you
 *     back up. You check that yourself from everyone's positions. Everyone down = night over.
 *   - A tab that comes back from a freeze or the background drops the host role for ~700ms and then
 *     adopts what is in state, so a stale host never rewinds the night. And nobody starts hosting
 *     while another tab is still writing the horde (it waits until that has been quiet for 400ms).
 *   - "again" (intent): someone pressed Play again on the results card.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "night-kills": each player's most kills in one night.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  runMs: 600000,         // the Night Lord comes at 10:00; beat him and dawn breaks
  readyMs: 3000,         // ms of "night falls" before the first monsters
  resultsMs: 15000,      // ms the results show before the next night starts
  startMinute: 0,        // where a new night starts on the clock (the preview starts late)
  seats: 4,              // bots fill the team up to this many hunters
  arena: 3000,           // the graveyard is this many px across (square)
  hp: 100,               // hunter health
  speed: 200,            // hunter speed, px/s
  magnet: 80,            // px: your gems fly to you from this far
  shieldMs: 2500,        // ms nothing can hurt you after you come in or get back up
  reviveRange: 70,       // stand this close to a downed teammate ...
  reviveMs: 3000,        // ... for this long to get them up (at half health)
  maxWeapons: 4,         // weapon slots
  maxPassives: 4,        // passive slots
  xpBase: 4,             // xp for the next level: xpBase + xpGrow × level + xpCurve × level²
  xpGrow: 5,
  xpCurve: 0.4,
  levelHeal: 0.1,        // part of your max health a level-up gives back
  novaDamage: 25,        // a level-up blasts the monsters around you for this much
  startLevel: 1,         // the level everyone starts a night at
  startWeapon: "M",      // what people start with (each bot starts with something else)
  hordeStart: 30,        // monsters on the field at minute 0 ...
  hordeGrow: 40,         // ... and this many more every minute
  maxFoes: 450,          // most monsters at once from topping up (the wire holds 600)
  spawnPerSec: 8,        // how fast the host tops the horde up at minute 0 ...
  spawnGrow: 5,          // ... and this much faster every minute
  spawnMax: 60,          // ... but never faster than this many a second
  hpGrow: 0.4,           // monsters come in tougher as the night goes on: health × (1 + hpGrow × minute + hpCurve × minute²)
  hpCurve: 0.05,
  hurtGrow: 0.15,        // ... and bite 15% harder
  maxBiters: 4,          // only this many monsters touching you hurt at once (the strongest ones)
  spawnDist: 780,        // px from a hunter where monsters come in (just off screen)
  farDist: 1500,         // px: a monster this far from every hunter comes back in near one
  swarmEvery: 90,        // seconds between bat swarms (a ring that closes in); the first at 0:45
  swarmSize: 24,         // bats in a swarm ...
  swarmGrow: 8,          // ... plus this many more every minute
  bossHp: 20000,         // the Night Lord's health (about two minutes for a full team)
  bossSummonEvery: 6,    // seconds between the bat rings the Night Lord calls
  maxGems: 400,          // most gems on your screen (extra ones merge into bigger gems)
  botSkill: 0.6,         // 0..1: how hard bots keep away from the horde
  botXp: 0.55,           // bots get this part of every kill's xp (they don't pick up gems)
  board: "night-kills",  // leaderboard name
};
const BOT_NAMES = ["Rook", "Sable", "Wren", "Ash", "Vesper", "Moss"];
const BOT_WEAPONS = ["S", "O", "D", "A"]; // each bot starts with the next one of these
const COLORS = ["#ffd166", "#4cc9f0", "#ff6b9a", "#7ee081", "#c79bff", "#ff9f43", "#f15bb5", "#9ef01a"];

// ── CONTENT ─────────────────────────────────────────────────────────────────────────
// Monster kinds. hp grows with the clock (CONFIG.hpGrow, hpCurve), dps = health per second a touch takes.
const KINDS = {
  b: { name: "bat",        hp: 5,   speed: 125, r: 11, dps: 6,  xp: 1 },
  g: { name: "ghoul",      hp: 12,  speed: 66,  r: 16, dps: 10, xp: 2 },
  s: { name: "skeleton",   hp: 20,  speed: 84,  r: 15, dps: 12, xp: 3 },
  w: { name: "wraith",     hp: 16,  speed: 102, r: 15, dps: 14, xp: 3 },
  t: { name: "brute",      hp: 85,  speed: 48,  r: 27, dps: 22, xp: 10 },
  E: { name: "elite",      hp: 420, speed: 74,  r: 34, dps: 30, xp: 40 },  // one a minute, drops a chest
  B: { name: "Night Lord", hp: 0,   speed: 62,  r: 66, dps: 55, xp: 0 },   // health: CONFIG.bossHp
};
// Which monsters come in, by minute: [from this minute on, {kind: weight}]
const WAVES = [
  [0, { b: 6, g: 4 }],
  [1, { b: 5, g: 5, s: 2 }],
  [2.5, { b: 4, g: 4, s: 4, w: 2 }],
  [4, { b: 4, g: 3, s: 4, w: 3, t: 1 }],
  [6, { b: 4, g: 2, s: 4, w: 4, t: 2 }],
  [8, { b: 5, g: 2, s: 3, w: 4, t: 3 }],
];
// Weapons: every array is levels 1..5. Codes are capital letters; a build is written like "M3O2s1".
const WEAPONS = {
  M: { name: "Moon Bolt", icon: "✦", color: "#9fd8ff", info: "Shoots the nearest monsters", cd: [1.1, 1.0, 0.9, 0.8, 0.7], n: [1, 2, 2, 3, 4], dmg: [12, 13, 17, 18, 24], pierce: [1, 1, 2, 2, 3] },
  D: { name: "Silver Daggers", icon: "†", color: "#e6ecff", info: "Thrown the way you walk", cd: [0.55, 0.5, 0.45, 0.4, 0.35], n: [1, 2, 3, 3, 4], dmg: [9, 9, 10, 13, 15], pierce: [1, 1, 1, 2, 2] },
  S: { name: "Night Scythe", icon: "☾", color: "#c79bff", info: "Sweeps the monsters beside you", cd: [1.4, 1.3, 1.2, 1.1, 1.0], dmg: [18, 20, 24, 28, 34], reach: [130, 140, 155, 165, 185], both: [0, 1, 1, 1, 1] },
  O: { name: "Star Orbit", icon: "✶", color: "#ffd166", info: "Stars circle you and burn", n: [2, 2, 3, 4, 5], dmg: [9, 11, 12, 14, 17], radius: [85, 95, 100, 110, 120], spin: [2.6, 2.8, 3, 3.2, 3.6] },
  A: { name: "Moon Aura", icon: "◎", color: "#7ee0ff", info: "Hurts every monster close by", cd: [0.5, 0.5, 0.5, 0.45, 0.4], dmg: [5, 6, 8, 10, 13], radius: [70, 80, 90, 100, 115] },
  Z: { name: "Storm Call", icon: "ϟ", color: "#fff27a", info: "Lightning hits monsters nearby", cd: [2.4, 2.2, 2.0, 1.8, 1.5], n: [2, 3, 4, 5, 7], dmg: [28, 32, 38, 44, 55] },
};
// Passives: each level adds `per` once. Codes are small letters.
const PASSIVES = {
  s: { name: "Swift Boots", icon: "»", info: "+8% walk speed", per: 0.08 },
  m: { name: "Lodestone", icon: "◉", info: "+35% gem pull range", per: 0.35 },
  a: { name: "Iron Skin", icon: "▣", info: "-7% damage taken", per: 0.07 },
  h: { name: "Big Heart", icon: "♥", info: "+20 max health", per: 20 },
  f: { name: "Fury", icon: "▲", info: "+10% weapon damage", per: 0.1 },
  q: { name: "Quick Hands", icon: "↻", info: "-7% weapon cooldowns", per: 0.07 },
  r: { name: "Wide Reach", icon: "◌", info: "+10% weapon size", per: 0.1 },
};
const MAX_LV = 5;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const parseBuild = (s) => { const b = {}; if (typeof s === "string") for (const [, c, n] of s.matchAll(/([A-Za-z])(\d)/g)) if (WEAPONS[c] || PASSIVES[c]) b[c] = +n; return b; };
const buildStr = (b) => Object.entries(b).map(([c, n]) => c + n).join("");
/** What a build adds up to: multipliers for speed, gem pull, damage, cooldowns, size, and armor and max health. */
function statsOf(b) {
  const p = (c) => (b[c] || 0) * PASSIVES[c].per;
  return { speed: 1 + p("s"), magnet: 1 + p("m"), armor: Math.min(0.6, p("a")), maxHp: CONFIG.hp + p("h"), might: 1 + p("f"), haste: Math.max(0.5, 1 - p("q")), area: 1 + p("r") };
}
const xpNeed = (lv) => CONFIG.xpBase + CONFIG.xpGrow * lv + CONFIG.xpCurve * lv * lv;

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'night-horde',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── FOES ────────────────────────────────────────────────────────────────────────────
// On the wire every monster is 10 characters: id(2) kind(1) x(2) y(2) hp(3). Numbers are base 36,
// positions to 2.5 px (+120 so they're never negative). A monster's id % 3 picks its field, so it
// never moves between fields. Each field starts with "f" and the night's id: it never looks like a
// number, and a field left over from the last night is ignored.
const FOE_FIELDS = ["f0", "f1", "f2"], PER_FIELD = 200; // 200 × 10 characters fits in 2048
const b36 = (n, w) => clamp(Math.round(n), 0, 36 ** w - 1).toString(36).padStart(w, "0");
const packPos = (v) => b36((v + 120) / 2.5, 2), unpackPos = (s) => parseInt(s, 36) * 2.5 - 120;
function packFoes(list, runId) {
  return "f" + b36(runId % 1296, 2) + list.map((f) => b36(f.id, 2) + f.k + packPos(f.x) + packPos(f.y) + b36(Math.ceil(f.hp), 3)).join("");

    ctx.strokeStyle = "#ffffff30"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, CONFIG.reviveRange * 0.6, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "#7ee081"; ctx.beginPath(); ctx.arc(x, y, CONFIG.reviveRange * 0.6, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(h.rv, 0, 1)); ctx.stroke();
    ctx.fillStyle = "#ff6b6b"; ctx.font = "900 20px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.globalAlpha = 0.6 + Math.sin(t * 6) * 0.4; ctx.fillText("!", x, y - 46); ctx.globalAlpha = 1; // above the name
  } else {
    if ((h === me ? Date.now() < me.shieldUntil : h.shield || Date.now() < h.shieldUntil) && Math.floor(t * 10) % 2) ctx.globalAlpha = 0.45;
    const bob = Math.hypot(h.vx || 0, h.vy || 0) > 20 ? Math.abs(Math.sin(t * 12)) * 2 : 0;
    ctx.fillStyle = h.color; ctx.beginPath(); ctx.moveTo(x - 15, y + 12); ctx.quadraticCurveTo(x - 17, y - 6 - bob, x, y - 15 - bob); ctx.quadraticCurveTo(x + 17, y - 6 - bob, x + 15, y + 12); ctx.closePath(); ctx.fill(); // cloak
    ctx.fillStyle = darken(h.color, 0.55); ctx.beginPath(); ctx.arc(x, y - 10 - bob, 9.5, 0, TAU); ctx.fill(); // hood
    ctx.fillStyle = "#0b0d18"; ctx.beginPath(); ctx.ellipse(x + h.fx * 2.5, y - 9 - bob, 5.8, 5.2, 0, 0, TAU); ctx.fill(); // face
    ctx.fillStyle = "#fff6c8"; ctx.fillRect(x + h.fx * 2.5 - 3.5, y - 10.5 - bob, 2.2, 2.2); ctx.fillRect(x + h.fx * 2.5 + 1.3, y - 10.5 - bob, 2.2, 2.2); // eyes
    ctx.fillStyle = "#ffcf7a"; ctx.beginPath(); ctx.arc(x + h.fx * 15, y + 3, 3.5, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffcf7a30"; ctx.beginPath(); ctx.arc(x + h.fx * 15, y + 3, 10, 0, TAU); ctx.fill(); // a lantern
    ctx.globalAlpha = 1;
  }
  if (ATTRACT) return;
  ctx.font = "700 12px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = h === me ? "#ffd166" : "#ffffffc0";
  ctx.fillText(h === me ? "You" : h.name, x, y - 30);
  if (!h.down) { ctx.fillStyle = "#0009"; ctx.fillRect(x - 18, y + 21, 36, 4); ctx.fillStyle = h.hp / h.mh > 0.35 ? "#7ee081" : "#ff6b6b"; ctx.fillRect(x - 18, y + 21, 36 * clamp(h.hp / h.mh, 0, 1), 4); }
}
function drawWeaponFx(t) {
  const nowS = performance.now() / 1000;
  ctx.lineCap = "round";
  for (const s of shots) { // bolts: a glowing ball with a tail; daggers: a silver streak
    if (!onScreen(s.x, s.y, 30)) continue;
    if (s.code === "M") { ctx.strokeStyle = "#9fd8ff66"; ctx.lineWidth = s.r * 1.6; ctx.beginPath(); ctx.moveTo(s.x - s.vx * 0.04, s.y - s.vy * 0.04); ctx.lineTo(s.x, s.y); ctx.stroke(); ctx.fillStyle = "#e8f6ff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.7, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = "#e6ecff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(s.x - Math.cos(s.a) * 16, s.y - Math.sin(s.a) * 16); ctx.lineTo(s.x, s.y); ctx.stroke(); }
  }
  for (const h of hunters) if (h.build.O && !h.down) { // orbiting stars
    const i = Math.min(MAX_LV, h.build.O) - 1;
    for (let k = 0; k < WEAPONS.O.n[i]; k++) {
      const p = orbitPos(h, WEAPONS.O, i, k, nowS);
      ctx.fillStyle = "#ffd16640"; ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff3c4"; ctx.beginPath(); for (let j = 0; j < 8; j++) { const a = j / 8 * TAU + nowS * 6, rr = j % 2 ? 3 : 9; ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); } ctx.fill();
    }
  }
  for (const a of arcs) { // scythe sweeps follow their hunter
    const k = a.t / 0.25, base = a.side > 0 ? 0 : Math.PI, sweep = -1.1 + k * 2.2;
    ctx.strokeStyle = `rgba(199,155,255,${0.85 * (1 - k)})`; ctx.lineWidth = 16 * (1 - k * 0.5);
    ctx.beginPath(); ctx.arc(a.h.x, a.h.y, a.reach * 0.75, base - 1.1, base + Math.min(1.1, sweep)); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - k)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(a.h.x, a.h.y, a.reach * 0.85, base - 1.1, base + Math.min(1.1, sweep)); ctx.stroke();
  }
  for (const z of zaps) { // lightning from the sky
    const k = z.t / 0.25, rnd = mulberry32(z.seed * 1000 | 0);
    ctx.strokeStyle = `rgba(255,242,122,${1 - k})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(z.x + (rnd() - 0.5) * 60, z.y - 320);
    for (let j = 1; j <= 6; j++) ctx.lineTo(z.x + (j < 6 ? (rnd() - 0.5) * 40 : 0), z.y - 320 + j * 320 / 6);
    ctx.stroke(); ctx.fillStyle = `rgba(255,250,200,${0.6 * (1 - k)})`; ctx.beginPath(); ctx.arc(z.x, z.y, 30 + k * 20, 0, TAU); ctx.fill();
  }
  for (const r of rings) { const k = r.t / (r.dur || 0.25); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = 5 * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.25 + k * 0.75), 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const p of sparks) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1; ctx.textAlign = "center";
  for (const p of pops) { ctx.globalAlpha = Math.max(0, 1 - p.t); ctx.font = `900 ${p.big ? 22 : 14}px system-ui, sans-serif`; ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
}
/** The dark around the edges of the screen (and a warm dawn when the night is won). */
function drawNight(r) {
  const dawn = r && r.phase === "over" && r.won;
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.hypot(W, H) * 0.55);
  g.addColorStop(0, "#02030a00"); g.addColorStop(1, dawn ? "#ff9a5a55" : ATTRACT ? "#02030a90" : "#02030ad0");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (dawn) { ctx.fillStyle = "#ffb07022"; ctx.fillRect(0, 0, W, H); }
}
function drawArrows(z) { // teammates off screen: an arrow at the edge (a pulsing one when they need help)
  for (const h of hunters) {
    if (h === me) continue;
    const fx = (h.x - cam.x) * z + W / 2, fy = (h.y - cam.y) * z + H / 2;
    if (fx > 0 && fx < W && fy > 0 && fy < H) continue;
    const a = Math.atan2(fy - H / 2, fx - W / 2), k = Math.min((W / 2 - 26) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - 26) / Math.abs(Math.sin(a) || 1e-6));
    ctx.save(); ctx.translate(W / 2 + Math.cos(a) * k, H / 2 + Math.sin(a) * k); ctx.rotate(a);
    ctx.fillStyle = h.down ? (Math.floor(performance.now() / 250) % 2 ? "#ff6b6b" : "#ffffff") : h.color;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.fill(); ctx.restore();
  }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
const HUD_IDS = ["lvl", "build", "clock", "team", "msg", "hint", "net"];
const startedAt = performance.now();
let board = null, dropped = false, banner = { text: "", until: 0 }, seenRun = { id: -1 };
function toast(title, sub, ms) { banner = { text: `${esc(title)}<small>${esc(sub)}</small>`, until: performance.now() + ms }; }
/** Banners for what the host just did to the night (from the `run` field, so everyone sees them). */
function watchRun(r) {
  if (seenRun.id !== r.id) { seenRun = { id: r.id, elites: r.elites, swarms: r.swarms, boss: r.boss }; return; }
  if (r.elites > seenRun.elites) { toast("AN ELITE APPROACHES", "Beat it for a chest: a free upgrade each", 3000); sfx("elite"); }
  if (r.swarms > seenRun.swarms) toast("BAT SWARM", "They're closing in from every side", 2500);
  if (r.boss && !seenRun.boss) { toast("THE NIGHT LORD RISES", "Beat him and dawn breaks", 4000); sfx("boss"); }
  Object.assign(seenRun, { elites: r.elites, swarms: r.swarms, boss: r.boss });
}
function hud(r) {
  const boss = nightLord();
  $("boss").hidden = !boss;
  if (boss) $("bossFill").style.width = (clamp(boss.hp / boss.max, 0, 1) * 100).toFixed(1) + "%";
  if (ATTRACT) { for (const id of HUD_IDS) $(id).textContent = ""; $("xp").style.display = "none"; return; }
  const t = Date.now(), el = t - r.startAt, tm = teamNow(), kills = tm.k?.[me.id] || 0;
  $("xpFill").style.width = (clamp(me.xp / xpNeed(me.lv), 0, 1) * 100).toFixed(1) + "%";
  $("lvl").innerHTML = `Lv ${me.lv}<small>${kills} kill${kills === 1 ? "" : "s"}</small>`;
  $("build").innerHTML = Object.entries(me.build).map(([c, n]) => { const D = WEAPONS[c] || PASSIVES[c]; return `<span style="color:${D.color || "#eef2ff"}">${D.icon} ${n}</span>`; }).join("");
  $("clock").innerHTML = r.phase === "over" ? "" : el < 0 ? `${Math.ceil(-el / 1000)}<small>Night falls…</small>` : `${clock(el)}<small>${r.boss ? "The Night Lord is here" : `Boss at ${clock(CONFIG.runMs)}`}</small>`;
  $("team").innerHTML = hunters.filter((h) => h !== me).map((h) => `<div><span style="color:${h.color}">${esc(h.name)}</span><span>Lv ${h.lv}</span>${h.down ? `<span class="down">DOWN</span>` : `<b><i style="width:${Math.round(clamp(h.hp / h.mh, 0, 1) * 100)}%"></i></b>`}</div>`).join("");
  watchRun(r);
  let msg = performance.now() < banner.until ? banner.text : "";
  if (me.down && r.phase === "play") msg = `YOU'RE DOWN<small>Hang on: a teammate standing next to you gets you up</small>`;
  if ($("msg").innerHTML !== msg) $("msg").innerHTML = msg;
  const touch = matchMedia("(pointer: coarse)").matches;
  $("hint").textContent = performance.now() - startedAt < 12000 && !me.choices ? (touch ? "Drag anywhere to walk · your weapons fire on their own · grab the gems" : "WASD, arrows or hold the mouse to walk · your weapons fire on their own · grab the gems") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the horde" : ""}`;
  if (r.phase === "play" && !me.down && me.picks > 0 && !me.choices) { // time to pick an upgrade
    me.choices = rollChoices(me);
    if (!me.choices.length) { me.choices = null; me.picks = 0; me.hp = me.mh; } // everything maxed: a full heal instead
    renderCards();
  }
  if ((r.phase !== "play" || me.down) && me.choices) { me.choices = null; renderCards(); }
  $("over").hidden = r.phase !== "over";
  if (r.phase === "over") {
    const final = r.final || [], mine = final.find((e) => e.i === me.id) || { k: kills, l: me.lv };
    $("overTitle").textContent = r.won ? "Dawn breaks!" : "The night took you";
    $("overSub").textContent = r.won ? "You beat the Night Lord." : "Everyone went down.";
    $("stTime").innerHTML = `${clock(Math.max(0, r.endedAt - r.startAt))}<small>SURVIVED</small>`;
    $("stKills").innerHTML = `${mine.k}<small>KILLS</small>`;
    $("stLevel").innerHTML = `${mine.l}<small>LEVEL</small>`;
    $("results").innerHTML = final.map((e) => `<li class="${e.i === me.id ? "me" : ""}"><span>Lv ${e.l} · ${e.k} kills</span><b style="color:${e.c}">●</b> ${esc(e.i === me.id ? myName : e.n)}</li>`).join("");
    $("next").textContent = `Next night in ${Math.max(0, Math.ceil((r.endsAt - t) / 1000))}s`;
    if (me.shownFor !== r.id) { me.shownFor = r.id; showBoard(mine.k); }
  }
}
function renderCards() {
  const box = $("cards");
  if (!me.choices || ATTRACT) { box.hidden = true; return; }
  box.hidden = false;
  $("cardsTitle").textContent = me.picks > 1 ? `LEVEL UP · PICK ONE (${me.picks} TO GO)` : "LEVEL UP · PICK ONE";
  $("cardRow").innerHTML = me.choices.map((c, i) => {
    const D = WEAPONS[c] || PASSIVES[c], lv = me.build[c] || 0;
    return `<button class="pick" data-i="${i}"><kbd>${i + 1}</kbd><span class="ic" style="color:${D.color || "#ffd166"}">${D.icon}</span><b>${D.name}</b><i>${lv ? `Lv ${lv} → ${lv + 1}` : "New!"}</i><small>${D.info}</small></button>`;
  }).join("");
}
function pickCard(i) {
  const c = me.choices && me.choices[i];
  if (!c) return;
  applyPick(me, c); me.picks--; me.choices = null;
  pops.push({ x: me.x, y: me.y - 40, t: 0, text: (WEAPONS[c] || PASSIVES[c]).name, color: "#ffd166" }); sfx("chest");
  renderCards(); publish(true);
  lastHud = 0; // show the next set of cards (if any) right away
}
$("cardRow").addEventListener("pointerdown", (e) => { const b = e.target.closest(".pick"); if (b) { e.preventDefault(); e.stopPropagation(); pickCard(+b.dataset.i); } });
function showBoard(kills) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class='note'>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class='note'>Loading…</li>";
  board.submit(kills).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li class='note'>No scores yet. You're first.</li>";
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
// Keys walk. Hold the mouse button to walk toward the pointer. Touch: a thumb stick wherever you put your thumb.
const keys = new Set(), mouse = { x: 0, y: 0, down: false }, stick = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
const MOVE = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE[k] || k === " ") e.preventDefault();
  if (k === "1" || k === "2" || k === "3") pickCard(+k - 1);
  keys.add(k); try { audio ||= new AudioContext(); } catch {}
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
addEventListener("pointerdown", () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // no menu on a right-click or a long press
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { if (e.button === 0) { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; } return; }
  if (stick.id !== null) return;
  Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; return; }
  if (e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.x0, dy = e.clientY - stick.y0; const d = Math.hypot(dx, dy);
  if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
  stick.dx = dx; stick.dy = dy; $("stick").firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = false; return; }
  if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; $("stick").hidden = true; }
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
/** This frame's walk direction (length 0..1) from keys, the stick or the held mouse. */
function readMove() {
  let x = 0, y = 0;
  for (const k of keys) if (MOVE[k]) { x += MOVE[k][0]; y += MOVE[k][1]; }
  if (stick.id !== null) { x = stick.dx / 50; y = stick.dy / 50; if (Math.hypot(x, y) < 0.15) x = y = 0; }
  else if (mouse.down) { // the pointer as a point in the world, through the camera this frame is drawn with
    const z = zoom(), wx = cam.x + (mouse.x - W / 2) / z, wy = cam.y + (mouse.y - H / 2) / z, dx = wx - me.x, dy = wy - me.y, d = Math.hypot(dx, dy);
    if (d > 6) { const k = Math.min(1, d / 50); x = dx / d * k; y = dy / d * k; }
  }
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  return { x, y };
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastReal = performance.now(), lastHb = 0, lastHud = 0, lastHits = 0;
function frame(now) {
  requestAnimationFrame(frame); // first: one exception below can't stop the game
  const real = performance.now(); // (the frame's own timestamp can date from before a freeze)
  if (real - lastReal > 1000) wakeUp(real); // back from a freeze or a background tab
  lastReal = real;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  listenForHost(real);
  if (mayHost(real)) hostTick(dt, now); else if (host.acting) stopHosting();
  const r = run();
  readSnapshots(now, r);
  syncViews(dt, now);
  hunters = allHunters();
  stepFoes(dt, r);
  if (r) myTick(dt, r);
  if (r && r.phase === "play") for (const h of hunters) stepWeapons(h, dt, h === me || (host.acting && host.bots.has(h.id)), now / 1000);
  stepShots(dt); stepFx(dt);
  if (now - lastHits > 125) { lastHits = now; flushHits(); }
  draw(now / 1000, dt, r);
  if (r && now - lastHud > 150) { lastHud = now; hud(r); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hits", (msg, from) => {
    const r = run();
    if (!host.acting || !r || r.phase !== "play" || !msg || !Array.isArray(msg.l)) return;
    for (const [id, d] of msg.l.slice(0, 200)) { const f = foes.get(Number(id)); if (f && !f.dead) hurtFoe(f, clamp(Number(d) || 0, 0, 5000), from); }
  });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { startMinute: 6.3, runMs: 6.3 * 60000 + 500, readyMs: 0, startLevel: 12, hordeStart: 450, spawnMax: 160, spawnDist: 560, hp: 900, hpGrow: 0.2, hpCurve: 0.03, shieldMs: 0 });
  me.build = { [me.startWeapon]: 1 }; refreshBuild(me);
  last = lastReal = performance.now();
  requestAnimationFrame(frame);
})();
</script>
